name: Apply P4.2 Learning Hub IA

on:
  push:
    branches:
      - v4.0-learning-studio
    paths:
      - ".github/workflows/apply-p42-learning-hub.yml"
      - "scripts/apply-p42-learning-hub.mjs"
      - "scripts/p42-payload/**"

permissions:
  contents: write

jobs:
  apply:
    name: Apply, verify, commit
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout v4 branch
        uses: actions/checkout@v4
        with:
          ref: v4.0-learning-studio
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply P4.2 Learning Hub IA
        run: node scripts/apply-p42-learning-hub.mjs

      - name: Remove one-time installer payload
        run: |
          rm -f .github/workflows/apply-p42-learning-hub.yml
          rm -f scripts/apply-p42-learning-hub.mjs
          rm -rf scripts/p42-payload

      - name: Syntax checks
        run: |
          node --check src/ui/learning-hub.js
          node --check src/ui/review-center.js
          node --check src/ui/learning-goals.js
          node --check src/ui/exam-sprint.js
          node --check src/learning/exam-sprint.js
          node --check src/storage/repositories/goals.js
          node --check src/app/main.js
          node --check tests/v40-p42-learning-hub-ia-run.mjs
          node --check service-worker.js

      - name: Full regression before commit
        run: npm run ci

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor(v4.0): split learning hub and scope exam sprint banks"
          git push origin HEAD:v4.0-learning-studio
