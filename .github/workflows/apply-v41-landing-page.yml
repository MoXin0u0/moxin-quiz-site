name: Apply v4.1 Landing Page

on:
  push:
    branches:
      - v4.1-landing-page
    paths:
      - ".github/workflows/apply-v41-landing-page.yml"
      - "scripts/apply-v41-landing-page.mjs"

permissions:
  contents: write

jobs:
  apply:
    name: v4.1 landing + app entry
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout v4.1 branch
        uses: actions/checkout@v4
        with:
          ref: v4.1-landing-page
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply v4.1 landing architecture
        run: node scripts/apply-v41-landing-page.mjs

      - name: Remove one-time installer files
        run: |
          rm -f .github/workflows/apply-v41-landing-page.yml
          rm -f scripts/apply-v41-landing-page.mjs

      - name: Syntax checks
        run: |
          node --check src/app/landing.js
          node --check src/app/config.js
          node --check service-worker.js
          node --check tests/v41-landing-page-run.mjs
          node --check tests/v41-landing-browser-run.mjs
          node --check scripts/v4-release-preflight.mjs

      - name: Full repository regression
        run: npm run ci

      - name: Install Chromium audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v41-http.log 2>&1 &
          echo $! > /tmp/v41-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/v41-http.log
          exit 1

      - name: Real Chromium landing audit
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npm run audit:landing

      - name: Upload landing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v41-landing-browser-audit
          path: artifacts/v41-landing-browser
          if-no-files-found: warn
          retention-days: 30

      - name: Stop local site
        if: always()
        run: |
          if [ -f /tmp/v41-http.pid ]; then
            kill "$(cat /tmp/v41-http.pid)" 2>/dev/null || true
          fi

      - name: Clean generated audit files
        run: rm -rf artifacts/v41-landing-browser node_modules package-lock.json

      - name: Commit only after all gates are green
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(v4.1): add public landing and app entry"
          git push origin HEAD:v4.1-landing-page
