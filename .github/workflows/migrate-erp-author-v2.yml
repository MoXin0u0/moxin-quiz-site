name: Generate ERP Schema v2

on:
  push:
    branches:
      - v3.2-erp-native
    paths:
      - ".github/workflows/migrate-erp-author-v2.yml"
      - "scripts/migrate-erp-author-to-v2.mjs"
      - "src/question-bank/author-catalog.js"
      - "tests/v31-run.mjs"
      - "tests/v32-run.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate + validate ERP author bank
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate native Schema v2 ERP package
        run: node scripts/migrate-erp-author-to-v2.mjs

      - name: Run full regression suite
        run: npm run ci

      - name: Commit generated v3.2 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            author-banks.json \
            author-banks/ERP_Planner_202509_V06/manifest.json \
            author-banks/ERP_Planner_202509_V06/questions.json \
            index.html \
            v3.html \
            service-worker.js \
            package.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "data(v3.2): generate native ERP author bank"
          git push
