name: Apply P3.1.1 Learning Goal Activity UX

on:
  push:
    branches:
      - v4.0-learning-studio
    paths:
      - ".github/workflows/apply-p311-goal-ux.yml"
      - "scripts/apply-p311-goal-ux.mjs"

permissions:
  contents: write

jobs:
  apply:
    name: Apply, verify, commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout v4 branch
        uses: actions/checkout@v4
        with:
          ref: v4.0-learning-studio
          fetch-depth: 0
          persist-credentials: true
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply P3.1.1 UX fix
        run: node scripts/apply-p311-goal-ux.mjs
      - name: Remove one-time installer files
        run: |
          rm -f .github/workflows/apply-p311-goal-ux.yml
          rm -f scripts/apply-p311-goal-ux.mjs
      - name: Syntax checks
        run: |
          node --check src/ui/learning-goals.js
          node --check tests/v40-p311-learning-goal-activity-ux-run.mjs
          node --check service-worker.js
      - name: Full regression before commit
        run: npm run ci
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix(v4.0): clarify learning activity without active goals"
          git push origin HEAD:v4.0-learning-studio
