name: v4.0 Production Cutover

on:
  push:
    branches:
      - v4.0-learning-studio
    paths:
      - ".github/workflows/v4-production-cutover.yml"
      - "scripts/finalize-v4-production.mjs"

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency:
  group: v4-production-cutover
  cancel-in-progress: false

jobs:
  release:
    name: Release v4.0 to main
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout validated RC1
        uses: actions/checkout@v4
        with:
          ref: v4.0-learning-studio
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main v4.0-learning-studio --prune

      - name: Verify release ancestry
        run: |
          MAIN_SHA=$(git rev-parse origin/main)
          RC_SHA=$(git rev-parse HEAD)

          git merge-base --is-ancestor origin/main HEAD

          behind=$(git rev-list --count HEAD..origin/main)
          ahead=$(git rev-list --count origin/main..HEAD)

          test "$behind" = "0"
          test "$ahead" -gt "0"

          echo "PRE_RELEASE_MAIN_SHA=${MAIN_SHA}" >> "$GITHUB_ENV"
          echo "RC_SHA=${RC_SHA}" >> "$GITHUB_ENV"

      - name: Re-run RC1 repository gates
        run: npm run ci

      - name: Build isolated production candidate
        run: |
          git checkout -b v4.0-production-candidate
          node scripts/finalize-v4-production.mjs

          node --check src/app/config.js
          node --check service-worker.js
          node --check tests/v40-production-release-run.mjs
          node --check scripts/v4-release-preflight.mjs

          npm run ci

          git add -A
          git commit -m "release(v4.0): finalize production candidate"

          PROD_HEAD_SHA=$(git rev-parse HEAD)
          echo "PROD_HEAD_SHA=${PROD_HEAD_SHA}" >> "$GITHUB_ENV"

          git push --force-with-lease origin HEAD:v4.0-production-candidate

      - name: Open production pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list \
            --base main \
            --head v4.0-production-candidate \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            PR_NUMBER="$existing"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head v4.0-production-candidate \
              --title "Release 墨忻刷題網 v4.0" \
              --body "RC1 Release Readiness 與 Main Cutover Rehearsal 已全綠。此 PR 將 v4.0 Production candidate 以 Merge Commit 發布到 main。")
            PR_NUMBER="${PR_URL##*/}"
          fi

          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"

      - name: Merge production pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..20}; do
            state=$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')
            if [ "$state" = "CLEAN" ] || [ "$state" = "UNSTABLE" ] || [ "$state" = "HAS_HOOKS" ]; then
              break
            fi
            if [ "$state" = "DIRTY" ] || [ "$state" = "BEHIND" ]; then
              echo "PR is not safely mergeable: $state"
              exit 1
            fi
            sleep 3
          done

          response=$(gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge \
            -f sha="${PROD_HEAD_SHA}" \
            -f commit_title="Release 墨忻刷題網 v4.0" \
            -f commit_message="Production cutover from validated v4.0 release candidate.")

          echo "$response" > /tmp/merge-response.json

          merged=$(node -e "const x=require('/tmp/merge-response.json'); process.stdout.write(String(x.merged))")
          test "$merged" = "true"

          MERGE_SHA=$(node -e "const x=require('/tmp/merge-response.json'); process.stdout.write(x.sha)")
          echo "RELEASE_MERGE_SHA=${MERGE_SHA}" >> "$GITHUB_ENV"

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MERGE_SHA"

      - name: Validate actual merged main
        run: |
          rm -rf /tmp/moxin-v4-production-main
          git worktree add --detach /tmp/moxin-v4-production-main origin/main
          cd /tmp/moxin-v4-production-main

          npm run ci

          grep -F '<title>墨忻刷題網 v4.0</title>' index.html
          grep -F '<span class="version-badge">v4.0</span>' index.html
          grep -F "CACHE_VERSION = 'moxin-quiz-v3-4.0.0-r2k.5-21'" service-worker.js

      - name: Rehearse rollback against actual merge commit
        run: |
          rm -rf /tmp/moxin-v4-rollback-check
          git worktree add --detach /tmp/moxin-v4-rollback-check "$RELEASE_MERGE_SHA"

          cd /tmp/moxin-v4-rollback-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert -m 1 --no-edit "$RELEASE_MERGE_SHA"

          if ! git diff --quiet "$PRE_RELEASE_MAIN_SHA" HEAD; then
            echo "Rollback tree does not match pre-release main."
            git diff --stat "$PRE_RELEASE_MAIN_SHA" HEAD
            exit 1
          fi

      - name: Switch GitHub Pages to main root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          update_status=$(curl -sS -o /tmp/pages-update.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data '{"source":{"branch":"main","path":"/"}}' || true)

          if [ "$update_status" != "204" ] && [ "$update_status" != "200" ]; then
            echo "GitHub Pages source update failed: HTTP ${update_status}"
            cat /tmp/pages-update.json || true
            exit 1
          fi

          branch=""
          page_path=""
          for i in {1..30}; do
            curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -o /tmp/pages-after.json

            branch=$(node -e "const x=require('/tmp/pages-after.json'); process.stdout.write(x.source?.branch || '')")
            page_path=$(node -e "const x=require('/tmp/pages-after.json'); process.stdout.write(x.source?.path || '')")

            if [ "$branch" = "main" ] && [ "$page_path" = "/" ]; then
              break
            fi
            sleep 2
          done

          test "$branch" = "main"
          test "$page_path" = "/"

          PAGES_URL=$(node -e "const x=require('/tmp/pages-after.json'); process.stdout.write(x.html_url || '')")
          test -n "$PAGES_URL"
          echo "PAGES_URL=${PAGES_URL}" >> "$GITHUB_ENV"

      - name: Public production smoke
        run: |
          ok=0

          for i in {1..60}; do
            if curl -fsS "${PAGES_URL}?release=${RELEASE_MERGE_SHA}-${i}" -o /tmp/public-index.html \
              && grep -Fq '<title>墨忻刷題網 v4.0</title>' /tmp/public-index.html \
              && curl -fsS "${PAGES_URL}service-worker.js?release=${RELEASE_MERGE_SHA}-${i}" -o /tmp/public-sw.js \
              && grep -Fq "CACHE_VERSION = 'moxin-quiz-v3-4.0.0-r2k.5-21'" /tmp/public-sw.js; then
              ok=1
              break
            fi
            sleep 5
          done

          test "$ok" = "1"

          curl -fsS "${PAGES_URL}v3.html?release=${RELEASE_MERGE_SHA}" -o /tmp/public-v3.html
          curl -fsS "${PAGES_URL}manifest.webmanifest?release=${RELEASE_MERGE_SHA}" -o /tmp/public-manifest.json

          cmp /tmp/public-index.html /tmp/public-v3.html

          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/public-manifest.json', 'utf8'));
          if (manifest.start_url !== './') throw new Error('Public manifest start_url mismatch');
          if (manifest.scope !== './') throw new Error('Public manifest scope mismatch');
          console.log('Public v4.0 production smoke: PASS');
          NODE

      - name: Create GitHub Release v4.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/v4-release-notes.md <<EOF
          # 墨忻刷題網 v4.0

          - Release merge: \`${RELEASE_MERGE_SHA}\`
          - Previous main: \`${PRE_RELEASE_MAIN_SHA}\`
          - Pages source: \`main / root\`
          - Public smoke: PASS
          - Rollback rehearsal: PASS

          主要內容：
          - 題庫工作室與圖片／批次建題
          - 學習目標與 Learning Hub
          - 考前衝刺
          - 7 / 30 日統計與弱點分析
          - Backup / Restore
          - PWA / Offline
          - Academy / Epic / Focus
          - Desktop / Tablet / Mobile
          EOF

          if gh release view v4.0.0 >/dev/null 2>&1; then
            echo "Release v4.0.0 already exists."
          else
            gh release create v4.0.0 \
              --target "$RELEASE_MERGE_SHA" \
              --title "墨忻刷題網 v4.0" \
              --notes-file /tmp/v4-release-notes.md
          fi

      - name: Remove temporary production candidate branch
        if: success()
        run: git push origin --delete v4.0-production-candidate || true

      - name: Release summary
        run: |
          {
            echo "# 墨忻刷題網 v4.0 Production"
            echo
            echo "- PR: #${PR_NUMBER}"
            echo "- Release merge: \`${RELEASE_MERGE_SHA}\`"
            echo "- Previous main: \`${PRE_RELEASE_MAIN_SHA}\`"
            echo "- GitHub Pages: \`${PAGES_URL}\`"
            echo "- Pages source: \`main / root\`"
            echo "- actual-main npm run ci: PASS"
            echo "- rollback rehearsal: PASS"
            echo "- public production smoke: PASS"
            echo "- GitHub Release: \`v4.0.0\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup worktrees
        if: always()
        run: |
          git worktree remove --force /tmp/moxin-v4-production-main 2>/dev/null || true
          git worktree remove --force /tmp/moxin-v4-rollback-check 2>/dev/null || true
          git worktree prune
