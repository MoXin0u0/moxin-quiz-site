name: Apply P4.1 Exam Sprint UI

on:
  push:
    branches:
      - v4.0-learning-studio
    paths:
      - ".github/workflows/apply-p41-sprint-ui.yml"
      - "scripts/apply-p41-sprint-ui.mjs"

permissions:
  contents: write

jobs:
  apply:
    name: Apply, verify, commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout v4 branch
        uses: actions/checkout@v4
        with:
          ref: v4.0-learning-studio
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply P4.1 sprint UI
        run: node scripts/apply-p41-sprint-ui.mjs

      - name: Remove one-time installer files
        run: |
          rm -f .github/workflows/apply-p41-sprint-ui.yml
          rm -f scripts/apply-p41-sprint-ui.mjs

      - name: Syntax checks
        run: |
          node --check src/ui/exam-sprint.js
          node --check src/learning/exam-sprint.js
          node --check src/quiz/session-engine.js
          node --check src/ui/review-center.js
          node --check src/app/main.js
          node --check tests/v40-p41-exam-sprint-ui-run.mjs
          node --check service-worker.js

      - name: Full regression before commit
        run: npm run ci

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(v4.0): integrate exam sprint UI and sessions"
          git push origin HEAD:v4.0-learning-studio
