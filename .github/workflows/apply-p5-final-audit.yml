name: Apply P5 Final Audit

on:
  push:
    branches:
      - v4.0-learning-studio
    paths:
      - ".github/workflows/apply-p5-final-audit.yml"
      - "scripts/apply-p5-final-audit.mjs"

permissions:
  contents: write

jobs:
  apply:
    name: Audit, verify, commit
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout v4 branch
        uses: actions/checkout@v4
        with:
          ref: v4.0-learning-studio
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply P5 Final Audit hardening
        run: node scripts/apply-p5-final-audit.mjs

      - name: Remove one-time installer files
        run: |
          rm -f .github/workflows/apply-p5-final-audit.yml
          rm -f scripts/apply-p5-final-audit.mjs

      - name: Syntax checks
        run: |
          node --check src/ui/home-dashboard.js
          node --check tests/v40-p5-final-audit-run.mjs
          node --check service-worker.js

      - name: Full P5 and repository regression
        run: npm run ci

      - name: Commit only after full green
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "test(v4.0): finalize P5 cross-page audit"
          git push origin HEAD:v4.0-learning-studio
