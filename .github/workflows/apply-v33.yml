name: Apply v3.3 Tools and Legacy Cleanup

on:
  push:
    branches:
      - v3.3-tools-cleanup
    paths:
      - ".github/workflows/apply-v33.yml"
      - "scripts/apply-v33.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Build + validate v3.3
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply v3.3 changes
        run: node scripts/apply-v33.mjs

      - name: Run full regression suite
        run: npm run ci

      - name: Retire one-time updater and commit v3.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm --ignore-unmatch \
            .github/workflows/apply-v33.yml \
            scripts/apply-v33.mjs

          git add -A

          if git diff --cached --quiet; then
            echo "No v3.3 changes to commit."
            exit 0
          fi

          git commit -m "feat(v3.3): add question bank tools and archive legacy v2"
          git push
