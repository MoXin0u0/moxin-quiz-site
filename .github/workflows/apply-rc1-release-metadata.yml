name: Apply RC1 Release Metadata

on:
  push:
    branches:
      - v4.0-learning-studio
    paths:
      - ".github/workflows/apply-rc1-release-metadata.yml"
      - "scripts/apply-rc1-release-metadata.mjs"

permissions:
  contents: write

jobs:
  metadata:
    name: Release metadata cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout v4 branch
        uses: actions/checkout@v4
        with:
          ref: v4.0-learning-studio
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply RC1 release metadata cleanup
        run: node scripts/apply-rc1-release-metadata.mjs

      - name: Remove one-time installer files
        run: |
          rm -f .github/workflows/apply-rc1-release-metadata.yml
          rm -f scripts/apply-rc1-release-metadata.mjs

      - name: Syntax checks
        run: |
          node --check src/app/config.js
          node --check scripts/v4-release-preflight.mjs
          node --check scripts/v4-regression-sweep.mjs
          node --check tests/v40-rc1-release-metadata-run.mjs
          node --check service-worker.js

      - name: Run every regression command independently
        run: node scripts/v4-regression-sweep.mjs

      - name: Full repository regression and v4 preflight
        run: npm run ci

      - name: Commit only after full green
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "chore(v4.0): promote release metadata to RC1"
          git push origin HEAD:v4.0-learning-studio
