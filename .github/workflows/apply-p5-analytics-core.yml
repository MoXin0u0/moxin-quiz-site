name: Apply P5 Analytics Core

on:
  push:
    branches:
      - v4.0-learning-studio
    paths:
      - ".github/workflows/apply-p5-analytics-core.yml"
      - "scripts/apply-p5-analytics-core.mjs"

permissions:
  contents: write

jobs:
  apply:
    name: Apply, verify, commit
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout v4 branch
        uses: actions/checkout@v4
        with:
          ref: v4.0-learning-studio
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply P5 Analytics Core
        run: node scripts/apply-p5-analytics-core.mjs

      - name: Remove one-time installer files
        run: |
          rm -f .github/workflows/apply-p5-analytics-core.yml
          rm -f scripts/apply-p5-analytics-core.mjs

      - name: Syntax checks
        run: |
          node --check src/learning/analytics.js
          node --check tests/v40-p5-analytics-core-run.mjs
          node --check service-worker.js

      - name: Full regression before commit
        run: npm run ci

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(v4.0): add P5 analytics core"
          git push origin HEAD:v4.0-learning-studio
